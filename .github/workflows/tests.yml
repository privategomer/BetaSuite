# .github/workflows/tests.yml
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The main branch ruleset and tools/release/release.py both wait on one
# check named "tests". That is the gate job at the bottom, which passes
# only when every test job passed, so a job added to its needs list is
# required without touching repository settings.

jobs:
  linux:
    name: tests (linux, full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-cpu.txt -r requirements-dev.txt
      - name: Run tests
        run: bash tests/run_tests.sh

  # Serve mode isolates stdout at the file-descriptor level, which behaves
  # differently on Windows; this proves it there. The rest of the suite
  # runs on Linux only for now.
  windows:
    name: tests (windows, engine protocol)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      # The config commands read betaconfig through the detector modules,
      # which import numpy and OpenCV; onnxruntime is not needed here.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run protocol, serve, config and stub client tests
        run: python -m unittest -v tests.test_protocol tests.test_serve tests.test_serve_config tests.test_stub_client

  tests:
    if: always()
    needs: [ linux, windows ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "linux: $LINUX, windows: $WINDOWS"
          test "$LINUX" = success && test "$WINDOWS" = success
