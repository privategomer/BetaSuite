# .github/workflows/tests.yml
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The main branch ruleset and tools/release/release.py both wait on one
# check named "tests". That is the gate job at the bottom, which passes
# only when every test job passed, so a job added to its needs list is
# required without touching repository settings.

jobs:
  linux:
    name: tests (linux, full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-cpu.txt -r requirements-dev.txt
      - name: Run tests
        run: bash tests/run_tests.sh

  # Serve mode isolates stdout at the file-descriptor level, which behaves
  # differently on Windows; this proves it there. The rest of the suite
  # runs on Linux only for now.
  windows:
    name: tests (windows, engine protocol)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run protocol, serve and stub client tests
        run: python -m unittest -v tests.test_protocol tests.test_serve tests.test_stub_client

  # The desktop UI under ui/. Lint, types and the Rust checks on Linux; a
  # release build on Windows, kept as an artifact for testing there.
  ui-linux:
    name: ui (linux, lint, types, catalog)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build the page
        run: npm run build
      - name: Install the Tauri build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install the Rust toolchain (src-tauri/rust-toolchain.toml)
        working-directory: ui/src-tauri
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ui/src-tauri/target
          key: cargo-linux-${{ hashFiles('ui/src-tauri/Cargo.lock', 'ui/src-tauri/rust-toolchain.toml') }}
          restore-keys: cargo-linux-
      - name: Rust format
        working-directory: ui/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: ui/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  ui-windows:
    name: ui (windows, build)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Install the Rust toolchain (src-tauri/rust-toolchain.toml)
        working-directory: ui/src-tauri
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ui/src-tauri/target
          key: cargo-windows-${{ hashFiles('ui/src-tauri/Cargo.lock', 'ui/src-tauri/rust-toolchain.toml') }}
          restore-keys: cargo-windows-
      - name: Build the app (release, no installer)
        run: npm run app:build
      - uses: actions/upload-artifact@v7
        with:
          name: betasuite-windows
          path: ui/src-tauri/target/release/betasuite.exe
          retention-days: 7
          if-no-files-found: error

  tests:
    if: always()
    needs: [ linux, windows, ui-linux, ui-windows ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          UI_LINUX: ${{ needs.ui-linux.result }}
          UI_WINDOWS: ${{ needs.ui-windows.result }}
        run: |
          echo "linux: $LINUX, windows: $WINDOWS, ui-linux: $UI_LINUX, ui-windows: $UI_WINDOWS"
          # One command: bash -e ignores a failure early in an && list, so a
          # failing test on an earlier line would not fail the step.
          for result in "$LINUX" "$WINDOWS" "$UI_LINUX" "$UI_WINDOWS"; do
            test "$result" = success || exit 1
          done
