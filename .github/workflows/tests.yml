# .github/workflows/tests.yml
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The main branch ruleset and tools/release/release.py both wait on one
# check named "tests". That is the gate job at the bottom, which passes
# only when every test job passed, so a job added to its needs list is
# required without touching repository settings.

jobs:
  linux:
    name: tests (linux, full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # ffmpeg 7.0.2, the johnvansickle.com static build (x264 included),
      # as republished on GitHub under this release tag.
      FFMPEG_RELEASE: b6.1.1
      FFMPEG_SHA256: bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
      FFPROBE_SHA256: 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      # A pinned static ffmpeg build, checked by SHA-256 and cached by
      # version. apt went through the runners' Ubuntu mirror, which took up
      # to 20 minutes. Change the version and both sums together.
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-${{ env.FFMPEG_RELEASE }}
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/ffmpeg-static && cd ~/ffmpeg-static
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/$FFMPEG_RELEASE"
          curl -sSfL --retry 3 -o ffmpeg.gz "$base/ffmpeg-linux-x64.gz"
          curl -sSfL --retry 3 -o ffprobe.gz "$base/ffprobe-linux-x64.gz"
          echo "$FFMPEG_SHA256  ffmpeg.gz" | sha256sum -c -
          echo "$FFPROBE_SHA256  ffprobe.gz" | sha256sum -c -
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
      - name: Put ffmpeg on the path
        run: |
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-static/ffmpeg" -hide_banner -version | head -1
      - name: Install dependencies
        run: pip install -r requirements-cpu.txt -r requirements-dev.txt
      - name: Run tests
        run: bash tests/run_tests.sh

  # Serve mode isolates stdout at the file-descriptor level, which behaves
  # differently on Windows; this proves it there. The rest of the suite
  # runs on Linux only for now.
  windows:
    name: tests (windows, engine protocol)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      # The config commands read betaconfig through the detector modules,
      # which import numpy and OpenCV; onnxruntime is not needed here.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run protocol, serve, config, stub client, paths, run lock and migration tests
        run: python -m unittest -v tests.test_protocol tests.test_serve tests.test_serve_config tests.test_stub_client tests.test_paths tests.test_run_lock tests.test_migrate

  # The desktop UI under ui/. Lint, types and the Rust checks on Linux; a
  # release build on Windows, kept as an artifact for testing there.
  ui-linux:
    name: ui (linux, lint, types, catalog)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Catalog check (every UI string comes from the message catalog)
        run: npm run catalog:check
      - name: Catalog check self-test
        run: npm run catalog:selftest
      - name: Theme contrast check (WCAG AA, both themes)
        run: npm run contrast:check
      - name: Build the page
        run: npm run build
      # The package lists and downloaded packages are cached together, so
      # a warm run installs without touching the Ubuntu mirror. If the
      # cached set no longer installs, it falls back to a fresh update.
      # Bump the key's last part to refresh the cache.
      - name: Restore the Tauri prerequisites' packages
        uses: actions/cache@v6
        with:
          path: ~/apt-tauri
          key: apt-tauri-${{ runner.os }}-ubuntu-24.04-v1
      - name: Install the Tauri build prerequisites
        timeout-minutes: 25
        env:
          PACKAGES: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
        run: |
          mkdir -p ~/apt-tauri/archives/partial ~/apt-tauri/lists/partial
          apt_dirs=( -o Dir::Cache::Archives="$HOME/apt-tauri/archives" -o Dir::State::Lists="$HOME/apt-tauri/lists" )
          # shellcheck disable=SC2086
          if [ -n "$(ls ~/apt-tauri/lists | grep -v partial)" ] \
              && sudo apt-get install -y --no-install-recommends --no-download "${apt_dirs[@]}" $PACKAGES; then
            echo "installed from the cache"
          else
            sudo apt-get update "${apt_dirs[@]}"
            sudo apt-get install -y --no-install-recommends "${apt_dirs[@]}" $PACKAGES
          fi
          sudo chown -R "$USER" ~/apt-tauri
      - name: Install the Rust toolchain (src-tauri/rust-toolchain.toml)
        working-directory: ui/src-tauri
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ui/src-tauri/target
          key: cargo-linux-${{ hashFiles('ui/src-tauri/Cargo.lock', 'ui/src-tauri/rust-toolchain.toml') }}
          restore-keys: cargo-linux-
      - name: Rust format
        working-directory: ui/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: ui/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      # The supervisor tests drive the real betaengine.py serve, which needs
      # only the standard library.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Engine supervisor tests
        working-directory: ui/src-tauri
        run: cargo test --locked

  ui-windows:
    name: ui (windows, build)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Install the Rust toolchain (src-tauri/rust-toolchain.toml)
        working-directory: ui/src-tauri
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ui/src-tauri/target
          key: cargo-windows-${{ hashFiles('ui/src-tauri/Cargo.lock', 'ui/src-tauri/rust-toolchain.toml') }}
          restore-keys: cargo-windows-
      - name: Build the app (release, no installer)
        run: npm run app:build
      - uses: actions/upload-artifact@v7
        with:
          name: betasuite-windows
          path: ui/src-tauri/target/release/betasuite.exe
          retention-days: 7
          if-no-files-found: error

  tests:
    if: always()
    needs: [ linux, windows, ui-linux, ui-windows ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          UI_LINUX: ${{ needs.ui-linux.result }}
          UI_WINDOWS: ${{ needs.ui-windows.result }}
        run: |
          echo "linux: $LINUX, windows: $WINDOWS, ui-linux: $UI_LINUX, ui-windows: $UI_WINDOWS"
          # One command: bash -e ignores a failure early in an && list, so a
          # failing test on an earlier line would not fail the step.
          for result in "$LINUX" "$WINDOWS" "$UI_LINUX" "$UI_WINDOWS"; do
            test "$result" = success || exit 1
          done
