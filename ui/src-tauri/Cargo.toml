[package]
name = "betasuite"
# The release version is the repository's VERSION file (build.rs); this
# field stays a placeholder so releases bump one file.
version = "0.0.0"
description = "BetaSuite desktop app"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "betasuite_lib"
crate-type = ["rlib"]

[[bin]]
name = "betasuite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
# Native file dialogs, used from Rust only; the page gets no dialog permission.
tauri-plugin-dialog = "2"

# WebKitGTK's security manager, to let the app's page load local video.
# Same major as the copy wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
